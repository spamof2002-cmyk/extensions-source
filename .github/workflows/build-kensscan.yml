name: Build Kens Scan APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kens Scan debug APK
        run: ./gradlew :src:en:kensscan:assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: KensScan-debug-APK
          path: src/en/kensscan/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
